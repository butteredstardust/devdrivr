[package]
name = "devdrivr"
version = "0.1.121"
description = "devdrivr — developer utility workspace"
authors = ["devdrivr"]
edition = "2021"

[lib]
name = "devdrivr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Dev-only browser bridge — see src/remote_ui.rs. Off by default and refused outright in release
# builds, because tauri-remote-ui is AGPL-3.0-only and linking it would put the whole binary under
# that copyleft. `bun run dev:remote` is the only thing that turns it on.
remote-ui = ["dep:tauri-remote-ui"]
# Web inspector in a release build, for debugging a packaged app. Off by default: the inspector
# runs any JavaScript with full IPC access, and on macOS it uses private APIs. Debug builds have
# the inspector without this feature. Build with `bun run tauri build --features devtools`.
devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-runtime = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-fs = "2"
# The plugin's defaults, but trusting the operating system's certificate store instead of a bundled
# root list, so API client requests work behind a proxy that re-signs TLS with a root installed by
# the organisation (corporate TLS inspection). Verification is unchanged.
tauri-plugin-http = { version = "2", default-features = false, features = ["rustls-tls-native-roots", "http2", "charset", "system-proxy", "cookies"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
# 2.14.1 is the first release on zip 9, which fixes the zip advisories. Keep it on the same minor as
# @tauri-apps/plugin-updater in package.json.
tauri-plugin-updater = "~2.14.1"
# Keeps dialog-granted file paths readable after a restart, for restored documents and recent files.
# Pinned to one minor: a new minor can require a newer tauri than the one in this file.
tauri-plugin-persisted-scope = "~2.4"
serde = { version = "1", features = ["derive"] }
# Reads the signing time in an update's signature: see src/update_guard.rs.
base64 = "0.22"
serde_json = "1"
rmcp = { version = "2.1.0", features = ["server", "macros", "transport-streamable-http-server", "schemars"] }
axum = "0.8"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }
# AGPL-3.0-only. Optional, and gated behind the `remote-ui` feature above — never in a shipped
# binary, which is why it is absent from src/lib/acknowledgments.ts.
tauri-remote-ui = { version = "1.1", optional = true }

# "Open With" on Windows and Linux launches a second process. This forwards its arguments to the
# running window — see src/opened_files.rs.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

# `tauri::test::mock_app` supplies the AppHandle the MCP service needs. Without it the service
# cannot be constructed in a unit test, which is why its permission and validation rules had no
# direct coverage.
[dev-dependencies]
tauri = { version = "2", features = ["test"] }
