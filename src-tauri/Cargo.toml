[package]
name = "devdrivr"
version = "0.1.94"
description = "devdrivr — developer utility workspace"
authors = ["devdrivr"]
edition = "2021"

[lib]
name = "devdrivr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Dev-only browser bridge — see src/remote_ui.rs. Off by default and refused outright in release
# builds, because tauri-remote-ui is AGPL-3.0-only and linking it would put the whole binary under
# that copyleft. `bun run dev:remote` is the only thing that turns it on.
remote-ui = ["dep:tauri-remote-ui"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "protocol-asset"] }
tauri-runtime = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmcp = { version = "0.16.0", features = ["server", "macros", "transport-streamable-http-server", "schemars"] }
axum = "0.8"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }
# AGPL-3.0-only. Optional, and gated behind the `remote-ui` feature above — never in a shipped
# binary, which is why it is absent from src/lib/acknowledgments.ts.
tauri-remote-ui = { version = "1.1", optional = true }

# "Open With" on Windows and Linux launches a second process. This forwards its arguments to the
# running window — see src/opened_files.rs.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
