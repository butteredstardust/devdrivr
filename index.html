<!doctype html>
<html lang="en" class="midnight">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>devdrivr</title>
  </head>

  <body>
    <div id="root"></div>
    <script>
      // Synchronous theme restore to prevent flash — runs before any CSS paint.
      // The settings store writes this cache on every theme change.
      //
      // Shape-checked rather than checked against a list of theme names: this
      // script cannot import ALL_THEMES, and the hardcoded list it used to
      // carry had gone stale at six entries. Every theme added since fell
      // through to the `midnight` class in <html>, so launching in any of them
      // painted Midnight first and then snapped to the real theme once React
      // hydrated — the exact flash this script exists to prevent. Only this
      // app writes the key, and the value only ever reaches a class attribute.
      try {
        var cached = localStorage.getItem('theme-cache')
        if (cached && /^[a-z][a-z0-9-]*$/.test(cached)) {
          document.documentElement.className = cached
        }
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
