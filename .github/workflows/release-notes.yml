name: 'Release notes'

# Writes or rewrites the notes of an existing release from a PR's release-notes markers, for a
# release whose PR was edited after it shipped. Release runs the same script for each new release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, such as devdrivr-v0.1.113'
        required: true
      pr:
        description: 'Number of the PR whose description holds the notes'
        required: true

permissions:
  contents: write
  pull-requests: read

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Write release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          PR: ${{ inputs.pr }}
        run: node scripts/release-notes.mjs --tag "$TAG" --pr "$PR"
