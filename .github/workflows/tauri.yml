name: 'Build & Release Cockpit'

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/cockpit/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bump:
    name: 'Auto-increment Version'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Auto-increment version
        id: bump
        run: |
          node apps/cockpit/scripts/bump-version.mjs

      - name: Commit version bump
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/cockpit/package.json apps/cockpit/src-tauri/tauri.conf.json
          git commit -m "chore(release): bump version to ${{ steps.bump.outputs.new_version }} [skip ci]"
          git push

  build:
    name: 'Build'
    needs: bump
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Intel macOS (macos-26-intel / x86_64-apple-darwin) was dropped after v0.1.82: the
          # frontend build OOMs the Intel runner's node, and the platform is on its way out
          # anyway. Intel users stay on 0.1.82 — the updater tells them there is no installer
          # for their platform rather than offering one that will not run.
          - platform: macos-26
            args: --target aarch64-apple-darwin
            description: 'macOS Apple Silicon'
          - platform: windows-latest
            args: ''
            description: 'Windows'
          - platform: ubuntu-24.04
            args: ''
            description: 'Linux'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # Ensure we pick up the bump-version commit

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/cockpit/src-tauri -> target

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Vite's transform stage peaked at 4048 MB against this cap on 0.1.83 and OOM-killed the
          # Linux and Windows builds; 0.1.82 had squeaked under it. The runners have 16 GB, so give
          # node room rather than tuning the ceiling one release at a time.
          NODE_OPTIONS: '--max-old-space-size=8192'
          # Minisign key for the updater plugin — unrelated to Apple/Microsoft code signing. It only
          # proves an update payload came from this repo; without it the build fails, because
          # tauri.conf.json declares a pubkey and `createUpdaterArtifacts`.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: cockpit-v__VERSION__
          releaseName: 'devdrivr Cockpit v__VERSION__'
          releaseBody: 'Download the installer for your platform from the assets below.'
          releaseDraft: false
          prerelease: false
          projectPath: ./apps/cockpit/
          tauriScript: bunx tauri
          args: ${{ matrix.args }}

  publish-update-manifest:
    name: 'Publish Update Manifest'
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./apps/cockpit/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify release assets and generate update manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="cockpit-v${VERSION}"
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Fetch actual asset names from the release and verify expected files exist
          ASSETS=$(gh release view "${TAG}" --json assets --jq '[.assets[].name]')
          echo "Release assets: ${ASSETS}"

          # The updater installs from these, not from the dmg/exe a human downloads: macOS swaps the
          # .app bundle, Windows runs the NSIS installer out of the zip, Linux rewrites the AppImage
          # in place. Each needs its detached minisign .sig, so a half-uploaded release aborts here
          # rather than publishing a manifest pointing at an artifact with no signature to check.
          EXPECTED_ASSETS=(
            "devdrivr_${VERSION}_aarch64.dmg"
            "devdrivr_${VERSION}_amd64.AppImage"
            "devdrivr_${VERSION}_x64-setup.exe"
            "devdrivr_aarch64.app.tar.gz"
            "devdrivr_aarch64.app.tar.gz.sig"
            "devdrivr_${VERSION}_amd64.AppImage.sig"
            "devdrivr_${VERSION}_x64-setup.nsis.zip"
            "devdrivr_${VERSION}_x64-setup.nsis.zip.sig"
          )

          MISSING=0
          for ASSET in "${EXPECTED_ASSETS[@]}"; do
            if ! echo "${ASSETS}" | grep -q "\"${ASSET}\""; then
              echo "WARNING: Expected asset not found in release: ${ASSET}"
              MISSING=$((MISSING + 1))
            fi
          done

          if [ "${MISSING}" -gt 0 ]; then
            echo "ERROR: ${MISSING} expected asset(s) missing from release ${TAG}. Aborting manifest generation."
            exit 1
          fi

          # Signatures are one-line base64 blobs the plugin checks against the pubkey baked into the
          # app. Read them from the release rather than rebuilding, so the manifest can only ever
          # describe the artifacts that actually shipped.
          gh release download "${TAG}" \
            --pattern "devdrivr_aarch64.app.tar.gz.sig" \
            --pattern "devdrivr_${VERSION}_amd64.AppImage.sig" \
            --pattern "devdrivr_${VERSION}_x64-setup.nsis.zip.sig" \
            --dir sigs
          SIG_DARWIN=$(cat "sigs/devdrivr_aarch64.app.tar.gz.sig")
          SIG_LINUX=$(cat "sigs/devdrivr_${VERSION}_amd64.AppImage.sig")
          SIG_WINDOWS=$(cat "sigs/devdrivr_${VERSION}_x64-setup.nsis.zip.sig")

          # Two manifests on purpose.
          #
          # updater.json is what tauri-plugin-updater reads from 0.1.85 onward: updater artifacts,
          # each with its signature.
          #
          # latest.json is the old hand-rolled format, and every user still on 0.1.84 or earlier
          # polls it. Those builds download whatever `url` says and hand the file to the user, so it
          # has to keep pointing at the dmg/exe a human can actually open. Delete it once nobody is
          # left on a pre-plugin version.
          #
          # No "darwin-x86_64" key in either: Intel macOS is unsupported as of 0.1.83. Omitting it
          # makes the updater report no update rather than handing an Intel Mac an arm64 bundle.
          cat > updater.json <<EOF
          {
            "version": "${VERSION}",
            "notes": "See the release page for details.",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "darwin-aarch64": {
                "url": "${BASE_URL}/devdrivr_aarch64.app.tar.gz",
                "signature": "${SIG_DARWIN}"
              },
              "linux-x86_64": {
                "url": "${BASE_URL}/devdrivr_${VERSION}_amd64.AppImage",
                "signature": "${SIG_LINUX}"
              },
              "windows-x86_64": {
                "url": "${BASE_URL}/devdrivr_${VERSION}_x64-setup.nsis.zip",
                "signature": "${SIG_WINDOWS}"
              }
            }
          }
          EOF

          cat > latest.json <<EOF
          {
            "version": "${VERSION}",
            "notes": "See the release page for details.",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "darwin-aarch64": {
                "url": "${BASE_URL}/devdrivr_${VERSION}_aarch64.dmg"
              },
              "linux-x86_64": {
                "url": "${BASE_URL}/devdrivr_${VERSION}_amd64.AppImage"
              },
              "windows-x86_64": {
                "url": "${BASE_URL}/devdrivr_${VERSION}_x64-setup.exe"
              }
            }
          }
          EOF

          node -e 'for (const f of ["updater.json", "latest.json"]) JSON.parse(require("fs").readFileSync(f, "utf8"))'

      - name: Upload update manifests to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="cockpit-v${VERSION}"
          gh release upload "${TAG}" updater.json latest.json --clobber
