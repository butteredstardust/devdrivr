name: 'devdrivr CI'

on:
  pull_request:
  push:
    branches:
      - main
  # Release calls this workflow and builds only after it passes. See release.yml.
  workflow_call:

concurrency:
  # A called workflow inherits the caller's `github.workflow`. Without the `-ci-` part, CI called
  # from Release would join Release's own concurrency group and wait on itself.
  group: ${{ github.workflow }}-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The Bun version comes from `packageManager` in package.json, so CI and contributors agree.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Vitest runs on Node. The SQLite integration tests need the built-in `node:sqlite`, and the
      # Windows-1252 tests need Node 24: Node 22 decodes that encoding as Latin-1.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Security audit
        run: bun audit --audit-level=critical

      - name: Lint
        run: bun run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit & component tests
        run: bun run test

      - name: Tool contract audit
        run: bun run audit:tools --gate

  rust-check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check

      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test
