name: 'devdrivr CI'

on:
  pull_request:
  push:
    branches:
      - main
  # Release calls this workflow and builds only after it passes. See release.yml.
  workflow_call:

concurrency:
  # A called workflow inherits the caller's `github.workflow`. Without the `-ci-` part, CI called
  # from Release would join Release's own concurrency group and wait on itself.
  group: ${{ github.workflow }}-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-checks:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The Bun version comes from `packageManager` in package.json, so CI and contributors agree.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Security audit
        run: bun audit --audit-level=critical

      - name: Lint
        run: bun run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Tool contract audit
        run: bun run audit:tools --gate

  frontend-tests:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # SQLite and Windows-1252 tests depend on Node 24 behavior.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit & component tests
        run: bunx vitest run --shard=${{ matrix.shard }}/2

  rust-check:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    env:
      # Keep source locations while reducing debug info in Clippy's dev-profile build.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install cargo-nextest
        uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-nextest@0.9.152
          fallback: none

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy --locked -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo nextest run --locked

      # Stable nextest does not run doctests.
      - name: Rust doctests
        working-directory: src-tauri
        run: cargo test --locked --doc
