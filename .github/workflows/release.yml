name: 'Build & Release devdrivr'

on:
  workflow_dispatch:
  push:
    branches:
      - main
    # Before the repo was flattened this filtered on `apps/cockpit/**`, which excluded the
    # monorepo's docs and tooling. At the root there is no such prefix, so the exclusions are
    # spelled out instead — without them a README typo bumps the version and cuts a release.
    # Deliberately NOT ignored: package.json, bun.lock, src-tauri/**, and the workflows
    # themselves, all of which change what ships.
    paths-ignore:
      - '**/*.md'
      - 'documentation/**'
      - 'samples/**'
      - 'screenshots/**'
      - 'LICENSE'
      - '.gitignore'
      - '.husky/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bump:
    name: 'Auto-increment Version'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Auto-increment version
        id: bump
        run: |
          node scripts/bump-version.mjs

      - name: Commit version bump
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "chore(release): bump version to ${{ steps.bump.outputs.new_version }} [skip ci]"
          git push

  build:
    name: 'Build'
    needs: bump
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Intel macOS (macos-26-intel / x86_64-apple-darwin) was dropped after v0.1.82: the
          # frontend build OOMs the Intel runner's node, and the platform is on its way out
          # anyway. Intel users stay on 0.1.82 — the updater tells them there is no installer
          # for their platform rather than offering one that will not run.
          - platform: macos-26
            args: --target aarch64-apple-darwin
            description: 'macOS Apple Silicon'
          - platform: windows-latest
            args: ''
            description: 'Windows'
          - platform: ubuntu-24.04
            args: ''
            description: 'Linux'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # Ensure we pick up the bump-version commit

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Vite's transform stage peaked at 4048 MB against this cap on 0.1.83 and OOM-killed the
          # Linux and Windows builds; 0.1.82 had squeaked under it. The runners have 16 GB, so give
          # node room rather than tuning the ceiling one release at a time.
          NODE_OPTIONS: '--max-old-space-size=8192'
          # Minisign key for the updater plugin — unrelated to Apple/Microsoft code signing. It only
          # proves an update payload came from this repo; without it the build fails, because
          # tauri.conf.json declares a pubkey and `createUpdaterArtifacts`.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Tags were `cockpit-v*` up to and including v0.1.86. The rename is safe because the
          # updater never resolves a tag: tauri.conf.json points it at
          # `releases/latest/download/updater.json`, which GitHub redirects to whatever the latest
          # release is, whatever its tag. Existing `cockpit-v*` tags and their asset URLs are
          # untouched, so anyone holding an old download link keeps it.
          tagName: devdrivr-v__VERSION__
          releaseName: 'devdrivr v__VERSION__'
          releaseBody: 'Download the installer for your platform from the assets below.'
          releaseDraft: false
          prerelease: false
          projectPath: .
          tauriScript: bunx tauri
          args: ${{ matrix.args }}
          # The action defaults this to true, which makes each of the three matrix jobs read
          # latest.json off the release, merge its own platform in, and upload it back — a
          # read-modify-write with no locking, so the last writer wins and platforms go missing.
          # It also writes latest.json in the *plugin* format, and until publish-update-manifest
          # clobbers it, `releases/latest/download/latest.json` would serve that to pre-0.1.85
          # clients, which would hand the user a .app.tar.gz as if it were an installer.
          # publish-update-manifest builds both manifests from the finished release instead.
          #
          # The input is `includeUpdaterJson` on the @v0 tag pinned above. The action's `dev` branch
          # renamed it to `uploadUpdaterJson`, and an unknown input is only a *warning* in Actions,
          # never an error — so reading the wrong ref's action.yml gives you a silent no-op. Check
          # the pinned ref's input list, not the default branch's, before changing this.
          includeUpdaterJson: false

  publish-update-manifest:
    name: 'Publish Update Manifest'
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify release assets and generate update manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="devdrivr-v${VERSION}"
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          ASSETS=$(gh release view "${TAG}" --json assets --jq '.assets[].name')
          echo "Release assets:"
          echo "${ASSETS}"

          # Asset names are resolved by pattern rather than hard-coded, because tauri-action is
          # pinned to the moving `@v0` tag and it — not the Tauri CLI — decides the final upload
          # name. Its `getAssetName` rewrites .app.tar.gz to add the architecture, and whether it
          # also adds the version has changed between releases of the action. Matching a pattern and
          # demanding exactly one hit turns a rename into a loud failure here, instead of a manifest
          # pointing at a URL that 404s for every user.
          V=${VERSION//./\\.}
          resolve() {
            local pattern="$1" desc="$2" match count
            match=$(echo "${ASSETS}" | grep -E "${pattern}" || true)
            count=$(echo "${match}" | grep -c . || true)
            if [ "${count}" -ne 1 ]; then
              echo "ERROR: expected exactly one ${desc} asset matching /${pattern}/, found ${count}" >&2
              [ -n "${match}" ] && echo "${match}" >&2
              return 1
            fi
            echo "${match}"
          }

          # Human downloads: what the release page offers and what pre-plugin clients fetch.
          DMG=$(resolve "^devdrivr_${V}_aarch64\.dmg$" "macOS dmg")
          APPIMAGE=$(resolve "^devdrivr_${V}_amd64\.AppImage$" "Linux AppImage")
          EXE=$(resolve "^devdrivr_${V}_x64-setup\.exe$" "Windows installer")

          # Updater payloads. macOS swaps the .app bundle out of a tarball; Linux rewrites the
          # running AppImage in place; Windows re-runs the NSIS installer — so on Linux and Windows
          # the updater payload is the very same file a human downloads. Only macOS differs.
          MAC_UPDATER=$(resolve "\.app\.tar\.gz$" "macOS updater bundle")
          SIG_DARWIN_ASSET=$(resolve "\.app\.tar\.gz\.sig$" "macOS updater signature")
          SIG_LINUX_ASSET=$(resolve "^devdrivr_${V}_amd64\.AppImage\.sig$" "Linux updater signature")
          SIG_WINDOWS_ASSET=$(resolve "^devdrivr_${V}_x64-setup\.exe\.sig$" "Windows updater signature")

          echo "Resolved updater artifacts: ${MAC_UPDATER}, ${APPIMAGE}, ${EXE}"

          # Signatures are one-line base64 blobs the plugin checks against the pubkey baked into the
          # app. Read them from the release rather than rebuilding, so the manifest can only ever
          # describe the artifacts that actually shipped.
          gh release download "${TAG}" \
            --pattern "${SIG_DARWIN_ASSET}" \
            --pattern "${SIG_LINUX_ASSET}" \
            --pattern "${SIG_WINDOWS_ASSET}" \
            --dir sigs
          SIG_DARWIN=$(cat "sigs/${SIG_DARWIN_ASSET}")
          SIG_LINUX=$(cat "sigs/${SIG_LINUX_ASSET}")
          SIG_WINDOWS=$(cat "sigs/${SIG_WINDOWS_ASSET}")

          # Two manifests on purpose.
          #
          # updater.json is what tauri-plugin-updater reads from 0.1.85 onward: updater artifacts,
          # each with its signature.
          #
          # latest.json is the old hand-rolled format, and every user still on 0.1.84 or earlier
          # polls it. Those builds download whatever `url` says and hand the file to the user, so it
          # has to keep pointing at the dmg/exe a human can actually open. Delete it once nobody is
          # left on a pre-plugin version.
          #
          # No "darwin-x86_64" key in either: Intel macOS is unsupported as of 0.1.83. Omitting it
          # makes the updater report no update rather than handing an Intel Mac an arm64 bundle.
          cat > updater.json <<EOF
          {
            "version": "${VERSION}",
            "notes": "See the release page for details.",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "darwin-aarch64": {
                "url": "${BASE_URL}/${MAC_UPDATER}",
                "signature": "${SIG_DARWIN}"
              },
              "linux-x86_64": {
                "url": "${BASE_URL}/${APPIMAGE}",
                "signature": "${SIG_LINUX}"
              },
              "windows-x86_64": {
                "url": "${BASE_URL}/${EXE}",
                "signature": "${SIG_WINDOWS}"
              }
            }
          }
          EOF

          cat > latest.json <<EOF
          {
            "version": "${VERSION}",
            "notes": "See the release page for details.",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "darwin-aarch64": {
                "url": "${BASE_URL}/${DMG}"
              },
              "linux-x86_64": {
                "url": "${BASE_URL}/${APPIMAGE}"
              },
              "windows-x86_64": {
                "url": "${BASE_URL}/${EXE}"
              }
            }
          }
          EOF

          node -e 'for (const f of ["updater.json", "latest.json"]) JSON.parse(require("fs").readFileSync(f, "utf8"))'

      - name: Upload update manifests to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="devdrivr-v${VERSION}"
          gh release upload "${TAG}" updater.json latest.json --clobber
