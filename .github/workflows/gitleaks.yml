name: Gitleaks

# Scan Git history for committed secrets. GitHub secret scanning finds known provider tokens only.
# Gitleaks also finds generic keys, passwords and JWTs.
#   - Pull request: scan the commits the pull request adds. A finding fails the check.
#   - Push to main: scan the pushed commits.
#   - Schedule and manual run: scan all history, so new Gitleaks rules also check old commits.
# To accept a false positive, add its fingerprint from the log to .gitleaksignore.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 3"

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history: the scan needs every commit in the range.
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version

      # The log prints findings redacted. No report is uploaded, so no secret leaves the runner.
      - name: Scan for secrets
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          case "$EVENT" in
            pull_request)
              range="${PR_BASE}..${PR_HEAD}" ;;
            push)
              # A force push or a new branch has no usable "before" commit. Scan the pushed commit only.
              if git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
                range="${BEFORE}..${AFTER}"
              else
                range="-1 ${AFTER}"
              fi ;;
            *)
              range="--all" ;;
          esac
          echo "Scanning: $range"
          /tmp/gitleaks git --redact --no-banner --verbose --log-opts="$range" .
