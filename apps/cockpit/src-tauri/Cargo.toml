[package]
name = "cockpit"
version = "0.1.84"
description = "devdrivr cockpit — developer utility workspace"
authors = ["devdrivr"]
edition = "2021"

[lib]
name = "cockpit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Dev-only browser bridge — see src/remote_ui.rs. Off by default and refused outright in release
# builds, because tauri-remote-ui is AGPL-3.0-only and linking it would put the whole binary under
# that copyleft. `bun run dev:remote` is the only thing that turns it on.
remote-ui = ["dep:tauri-remote-ui"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-runtime = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmcp = { version = "0.16.0", features = ["server", "macros", "transport-streamable-http-server", "schemars"] }
axum = "0.8"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }
# AGPL-3.0-only. Optional, and gated behind the `remote-ui` feature above — never in a shipped
# binary, which is why it is absent from src/lib/acknowledgments.ts.
tauri-remote-ui = { version = "1.1", optional = true }

# Rounding the window corners is an AppKit-level change (see src/window_corners.rs). These are
# already in the dependency graph via tao/wry, so this pins names rather than pulling new crates.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSColor",
  "NSResponder",
  "NSView",
  "NSWindow",
  "objc2-quartz-core",
] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer", "objc2-core-foundation"] }
